<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Свой путь</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:wght@700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --text: #e8e4f0;
    --text-muted: #9b96b0;
    --accent: #c084fc;
    --border: rgba(255,255,255,0.08);
    --btn-bg: rgba(255,255,255,0.07);
    --btn-hover: rgba(192,132,252,0.18);
    --btn-border: rgba(192,132,252,0.3);
  }

  html, body {
    height: 100%; height: 100dvh;
    font-family: 'Nunito', sans-serif;
    background: #0f1724;
    color: var(--text);
    overflow: hidden;
  }

  #bg-layer {
    position: fixed; inset: 0; z-index: 0;
    background-size: cover; background-position: center;
    transition: background-image 0.6s ease;
  }
  #bg-layer::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(8,10,20,0.55) 0%, rgba(8,10,20,0.92) 100%);
  }

  #app {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    max-width: 720px; margin: 0 auto;
  }

  /* STATS */
  #stats {
    display: flex; gap: 6px; padding: 10px 14px 6px;
    flex-shrink: 0;
  }
  .stat {
    flex: 1; background: rgba(0,0,0,0.5);
    border: 1px solid var(--border);
    border-radius: 12px; padding: 6px 8px; text-align: center;
  }
  .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); line-height: 1; }
  .stat-value { font-size: 20px; font-weight: 700; line-height: 1.2; margin-top: 2px; }
  .stat-bar { height: 3px; border-radius: 2px; margin-top: 3px; background: rgba(255,255,255,0.1); overflow: hidden; }
  .stat-fill { height: 100%; border-radius: 2px; transition: width 0.4s ease; }
  #sv-anx { color: #f87171; } #sf-anx { background: #f87171; }
  #sv-ind { color: #c084fc; } #sf-ind { background: #c084fc; }
  #sv-prg { color: #6ee7b7; } #sf-prg { background: #6ee7b7; }
  #sv-stg { color: #fb923c; } #sf-stg { background: #fb923c; }

  /* SCENE */
  #scene {
    flex: 1; overflow-y: auto; padding: 10px 14px 4px;
    display: flex; flex-direction: column; justify-content: flex-end;
    -webkit-overflow-scrolling: touch;
  }

  #text-box {
    background: rgba(12,14,28,0.8);
    backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-left: 3px solid #ffaa44;
    border-radius: 20px;
    padding: 18px 20px;
    margin-bottom: 12px;
    min-height: 80px;
  }
  #scene-text { font-size: 18px; line-height: 1.6; color: var(--text); }
  #scene-text .line {
    opacity: 0; transform: translateY(5px);
    transition: opacity 0.4s ease, transform 0.4s ease;
    display: block; margin-bottom: 2px;
  }
  #scene-text .line.shown { opacity: 1; transform: none; }

  /* TIMER */
  #timer-wrap { display: none; margin-top: 10px; }
  #timer-label { font-size: 13px; color: #fb923c; font-weight: 700; margin-bottom: 4px; }
  #timer-bar { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
  #timer-fill { height: 100%; background: linear-gradient(90deg,#f87171,#fb923c); border-radius: 2px; transition: width 1s linear; }

  /* CHOICES */
  #choices {
    display: flex; flex-direction: column; gap: 8px;
    padding: 0 14px 12px; flex-shrink: 0;
  }

  .choice-btn {
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    border-radius: 50px; padding: 13px 20px;
    font-family: 'Nunito', sans-serif;
    font-size: 16px; font-weight: 600;
    color: var(--text); cursor: pointer; text-align: left;
    transition: background 0.2s, transform 0.15s;
    line-height: 1.4;
    opacity: 0; transform: translateY(6px);
    animation: fadeUp 0.3s ease forwards;
  }
  .choice-btn:nth-child(1){animation-delay:.04s}
  .choice-btn:nth-child(2){animation-delay:.1s}
  .choice-btn:nth-child(3){animation-delay:.16s}
  .choice-btn:nth-child(4){animation-delay:.22s}
  .choice-btn:hover { background: var(--btn-hover); transform: translateX(4px); }
  .choice-btn:active { transform: scale(0.98); }
  @keyframes fadeUp { to { opacity:1; transform:none; } }

  #psych-btn {
    background: rgba(110,231,183,0.1);
    border: 1px solid rgba(110,231,183,0.4);
    border-radius: 50px; padding: 12px 20px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px; font-weight: 700;
    color: #6ee7b7; cursor: pointer; text-align: left;
    transition: background 0.2s, transform 0.15s;
    display: none; margin-bottom: 4px;
  }
  #psych-btn:hover { background: rgba(110,231,183,0.2); transform: translateX(4px); }

  /* FOOTER */
  #footer {
    display: flex; gap: 8px; padding: 0 14px 14px;
    flex-shrink: 0;
  }
  .foot-btn {
    flex: 1; background: rgba(255,255,255,0.05);
    border: 1px solid var(--border); border-radius: 30px;
    font-family: 'Nunito', sans-serif; font-size: 13px;
    color: var(--text-muted); cursor: pointer; padding: 8px 10px;
    transition: background 0.2s;
  }
  .foot-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }

  /* MODAL */
  #modal {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.88); backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  #modal-box {
    background: #141828; border: 1px solid var(--border);
    border-radius: 24px; padding: 30px 26px;
    max-width: 360px; width: 100%; text-align: center;
  }
  #modal-box h2 { font-family: 'Playfair Display', serif; font-size: 22px; margin-bottom: 10px; color: var(--accent); }
  #modal-box p { font-size: 15px; color: var(--text-muted); margin-bottom: 22px; line-height: 1.5; }
  .m-btn {
    display: block; width: 100%; padding: 13px;
    border-radius: 12px; border: 1px solid var(--btn-border);
    background: var(--btn-bg); color: var(--text);
    font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 700;
    cursor: pointer; margin-bottom: 10px; transition: background 0.2s;
  }
  .m-btn:hover { background: var(--btn-hover); }
  .m-btn.primary { background: linear-gradient(135deg,#7c3aed,#c084fc); border-color: transparent; color: #fff; }

  /* PSYCH IMAGE */
  #psych-img {
    position: fixed; bottom: 0; right: 0; z-index: 5;
    width: min(180px,38vw); display: none; opacity: 0;
    transition: opacity 0.5s;
    pointer-events: none;
  }
  #psych-img img { width: 100%; display: block; }

  @media (max-width: 480px) {
    .stat-value { font-size: 17px; }
    #scene-text { font-size: 17px; }
    .choice-btn { font-size: 15px; padding: 12px 16px; }
  }

  /* PASSWORD SCREEN */
  #pwd-screen {
    position: fixed; inset: 0; z-index: 200;
    background: #0a0d18;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  #pwd-box {
    text-align: center; max-width: 340px; width: 100%;
  }
  #pwd-logo { font-size: 48px; margin-bottom: 16px; }
  #pwd-box h2 {
    font-family: 'Playfair Display', serif;
    font-size: 26px; color: var(--accent);
    margin-bottom: 8px;
  }
  #pwd-box p { font-size: 15px; color: var(--text-muted); margin-bottom: 24px; }
  #pwd-input {
    width: 100%; padding: 14px 18px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--btn-border);
    border-radius: 14px; color: var(--text);
    font-family: 'Nunito', sans-serif; font-size: 17px;
    outline: none; text-align: center; letter-spacing: 0.15em;
    margin-bottom: 12px;
    transition: border-color 0.2s;
  }
  #pwd-input:focus { border-color: var(--accent); }
  #pwd-submit {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg,#7c3aed,#c084fc);
    border: none; border-radius: 14px;
    font-family: 'Nunito', sans-serif; font-size: 17px; font-weight: 700;
    color: #fff; cursor: pointer;
    transition: opacity 0.2s;
  }
  #pwd-submit:hover { opacity: 0.88; }
  #pwd-error {
    margin-top: 12px; font-size: 14px;
    color: #f87171; min-height: 20px;
  }
</style>
</head>
<body>

<div id="bg-layer"></div>

<div id="app">
  <div id="stats">
    <div class="stat">
      <div class="stat-label">😰 Тревога</div>
      <div class="stat-value" id="sv-anx">0</div>
      <div class="stat-bar"><div class="stat-fill" id="sf-anx" style="width:0%"></div></div>
    </div>
    <div class="stat">
      <div class="stat-label">🕊️ Самост.</div>
      <div class="stat-value" id="sv-ind">0</div>
      <div class="stat-bar"><div class="stat-fill" id="sf-ind" style="width:0%"></div></div>
    </div>
    <div class="stat">
      <div class="stat-label">📈 Прогресс</div>
      <div class="stat-value" id="sv-prg">0</div>
      <div class="stat-bar"><div class="stat-fill" id="sf-prg" style="width:0%"></div></div>
    </div>
    <div class="stat">
      <div class="stat-label">⏳ Стагнация</div>
      <div class="stat-value" id="sv-stg">0</div>
      <div class="stat-bar"><div class="stat-fill" id="sf-stg" style="width:0%"></div></div>
    </div>
  </div>

  <div id="scene">
    <div id="text-box">
      <div id="scene-text"></div>
      <div id="timer-wrap">
        <div id="timer-label">⏱️ 10 секунд...</div>
        <div id="timer-bar"><div id="timer-fill" style="width:100%"></div></div>
      </div>
    </div>
  </div>

  <div id="choices">
    <button id="psych-btn">🧠 Психолог (снизить тревогу)</button>
  </div>

  <div id="footer">
    <button class="foot-btn" onclick="resetGame()">🔄 Заново</button>
    <button class="foot-btn" onclick="saveGame()">💾 Сохранить</button>
    <button class="foot-btn" onclick="loadGame()">📀 Загрузить</button>
  </div>
</div>

<div id="psych-img"><img src="images/psychologist.jpg" alt="" onerror="this.parentElement.style.display='none'"></div>

<div id="pwd-screen">
  <div id="pwd-box">
    <div id="pwd-logo">🗝️</div>
    <h2>Свой путь</h2>
    <p>Введи пароль для доступа к игре</p>
    <input id="pwd-input" type="password" placeholder="Пароль..." autocomplete="off" />
    <button id="pwd-submit" onclick="checkPassword()">Войти</button>
    <div id="pwd-error"></div>
  </div>
</div>

<div id="modal">
  <div id="modal-box">
    <h2 id="m-title">Свой путь</h2>
    <p id="m-text">Продолжить сохранённую игру или начать заново?</p>
    <button class="m-btn primary" id="m-btn1" onclick="modalAct(1)">Продолжить</button>
    <button class="m-btn" id="m-btn2" onclick="modalAct(2)">Начать заново</button>
  </div>
</div>

<script>
// ─── STATE ────────────────────────────────────────────────
let gs = { node:"node1", тревога:0, самостоятельность:0, прогресс:0, стагнация:0, circleCount:0 };
let timerInt = null, bgDelayInt = null, textInt = null;
let mCb1 = null, mCb2 = null;

const SAVE_KEY = "svoy_put_v2";

// ─── MODAL ────────────────────────────────────────────────
const modal = document.getElementById("modal");
function showModal(title, text, b1, b2, cb1, cb2) {
  document.getElementById("m-title").textContent = title;
  document.getElementById("m-text").textContent = text;
  document.getElementById("m-btn1").textContent = b1;
  document.getElementById("m-btn2").textContent = b2;
  mCb1=cb1; mCb2=cb2; modal.style.display="flex";
}
function hideModal(){ modal.style.display="none"; }
function modalAct(n){ hideModal(); (n===1?mCb1:mCb2)?.(); }

// ─── BACKGROUND ───────────────────────────────────────────
const bgEl = document.getElementById("bg-layer");
function setBg(key){
  if(!key){ bgEl.style.backgroundImage="none"; return; }
  const src=`images/${key}.jpg`;
  const img=new Image();
  img.onload=()=>bgEl.style.backgroundImage=`url('${src}')`;
  img.onerror=()=>bgEl.style.backgroundImage="none";
  img.src=src;
}

// ─── STATS ────────────────────────────────────────────────
function clamp(v,min,max){return Math.max(min,Math.min(max,v));}
function applyFx(fx){
  if(!fx)return;
  if(fx.тревога)          gs.тревога          = clamp(gs.тревога+fx.тревога,0,10);
  if(fx.самостоятельность)gs.самостоятельность= clamp(gs.самостоятельность+fx.самостоятельность,0,20);
  if(fx.прогресс)         gs.прогресс         = clamp(gs.прогресс+fx.прогресс,0,20);
  if(fx.стагнация)        gs.стагнация        = clamp(gs.стагнация+fx.стагнация,0,20);
  updateStatsUI();
}
function updateStatsUI(){
  const t=gs.тревога, i=gs.самостоятельность, p=gs.прогресс, s=gs.стагнация;
  document.getElementById("sv-anx").textContent=t;
  document.getElementById("sv-ind").textContent=i;
  document.getElementById("sv-prg").textContent=p;
  document.getElementById("sv-stg").textContent=s;
  document.getElementById("sf-anx").style.width=(t/10*100)+"%";
  document.getElementById("sf-ind").style.width=(i/20*100)+"%";
  document.getElementById("sf-prg").style.width=(p/20*100)+"%";
  document.getElementById("sf-stg").style.width=(s/20*100)+"%";
  document.getElementById("sv-anx").style.color = t>=7?"#ff8866":"#f87171";

  const pb = document.getElementById("psych-btn");
  const pi = document.getElementById("psych-img");
  if(t>=7){
    pb.style.display="block";
    pi.style.display="block"; setTimeout(()=>pi.style.opacity="1",50);
  } else {
    pb.style.display="none";
    pi.style.opacity="0"; setTimeout(()=>pi.style.display="none",500);
  }
}

// ─── TEXT ─────────────────────────────────────────────────
const sceneText = document.getElementById("scene-text");
function renderText(lines, cb){
  sceneText.innerHTML="";
  clearTimeout(textInt);
  if(!lines||!lines.length||(lines.length===1&&lines[0]==="")){
    cb?.(); return;
  }
  lines.forEach(l=>{
    const el=document.createElement("span");
    el.className="line"; el.textContent=l||"\u00A0";
    sceneText.appendChild(el);
  });
  const spans=[...sceneText.querySelectorAll(".line")];
  let i=0;
  function next(){
    if(i<spans.length){ spans[i++].classList.add("shown"); textInt=setTimeout(next,380); }
    else cb?.();
  }
  next();
}
function renderSequential(lines, interval, cb){
  sceneText.innerHTML="";
  let i=0;
  function next(){
    if(i<lines.length){
      const el=document.createElement("span");
      el.className="line"; el.textContent=lines[i++];
      sceneText.appendChild(el);
      setTimeout(()=>el.classList.add("shown"),30);
      if(i<lines.length) textInt=setTimeout(next,interval);
      else setTimeout(()=>cb?.(),400);
    }
  }
  next();
}

// ─── TIMER ────────────────────────────────────────────────
const timerWrap=document.getElementById("timer-wrap");
const timerLabel=document.getElementById("timer-label");
const timerFill=document.getElementById("timer-fill");
function startTimer(secs, onDone){
  timerWrap.style.display="block";
  timerLabel.textContent=`⏱️ ${secs} секунд...`;
  timerFill.style.transition="none"; timerFill.style.width="100%";
  requestAnimationFrame(()=>{
    timerFill.style.transition=`width ${secs}s linear`; timerFill.style.width="0%";
  });
  let rem=secs;
  clearInterval(timerInt);
  timerInt=setInterval(()=>{
    rem--;
    timerLabel.textContent=`⏱️ ${rem} секунд...`;
    if(rem<=0){ clearInterval(timerInt); timerWrap.style.display="none"; onDone?.(); }
  },1000);
}
function stopTimer(){ clearInterval(timerInt); timerWrap.style.display="none"; }

// ─── CHOICES ──────────────────────────────────────────────
const choicesDiv=document.getElementById("choices");
function clearChoices(){ [...choicesDiv.querySelectorAll(".choice-btn")].forEach(b=>b.remove()); }
function renderChoices(choices){
  clearChoices();
  choices.forEach((ch,i)=>{
    const btn=document.createElement("button");
    btn.className="choice-btn";
    btn.style.animationDelay=(0.04+i*0.07)+"s";
    btn.textContent=ch.text;
    btn.onclick=()=>{
      stopTimer();
      if(bgDelayInt){ clearInterval(bgDelayInt); bgDelayInt=null; }
      if(ch.statChanges) applyFx(ch.statChanges);
      if(ch.nextNode) gotoNode(ch.nextNode);
    };
    choicesDiv.appendChild(btn);
  });
}

// ─── PSYCHOLOGIST ─────────────────────────────────────────
document.getElementById("psych-btn").onclick=()=>{
  const prev=gs.node;
  gs.тревога=Math.max(0,gs.тревога-2);
  gs.самостоятельность=Math.min(20,gs.самостоятельность+1);
  updateStatsUI(); saveGame();
  clearChoices(); setBg("psychologist");
  renderText(["Психолог: «Помни, что работа должна тебе нравиться. Ты уже пробовал работать там, где тебе было плохо. Тебе нужна поддержка, а не упрёки»."],()=>{
    renderChoices([{text:"Спасибо, продолжу",nextNode:prev}]);
  });
};

// ─── GOTO / RENDER ────────────────────────────────────────
function gotoNode(nodeId){
  stopTimer();
  if(bgDelayInt){ clearInterval(bgDelayInt); bgDelayInt=null; }
  clearChoices();

  // panic at trevoga 10
  if(gs.тревога>=10 && !["node17","goodEnd","badEnd","neutralEnd"].includes(nodeId)){
    nodeId="node17";
  }

  // circle counter: node7 → node3 repeated 3 times → node17
  if(nodeId==="node7"){
    gs.circleCount++;
    if(gs.circleCount>=3){ gs.circleCount=0; nodeId="node17"; }
  }

  gs.node=nodeId; saveGame();

  const n=scenes[nodeId];
  if(!n){ console.error("Node not found:",nodeId); return; }

  // node-level stat effect
  if(n.effect) applyFx(n.effect);

  setBg(n.bg||"");

  // FINALS
  if(n.isFinal){ renderFinal(n); return; }

  // AUTO (no choices, just go next after delay)
  if(n.auto){
    renderText(n.text||[""],()=>{
      setTimeout(()=>{
        if(n.autoFx) applyFx(n.autoFx);
        gotoNode(n.autoNext);
      }, n.text&&n.text[0]?1800:500);
    });
    return;
  }

  // NODE 4 special: timed sequential text
  if(nodeId==="node4"){
    renderSequential(n.timedText, 1800, ()=>{
      startTimer(n.timerSeconds, ()=>{
        if(n.timeoutFx) applyFx(n.timeoutFx);
        gotoNode(n.timeoutTarget);
      });
      renderChoices(n.choices);
    });
    return;
  }

  // NODE 20 special: two-phase text + bg change
  if(nodeId==="node20"){
    renderText(n.text||[""],()=>{
      bgDelayInt=setTimeout(()=>{
        if(n.bg2) setBg(n.bg2);
        renderText(n.text2||[""],()=>{ renderChoices(n.choices); });
      },1800);
    });
    return;
  }

  renderText(n.text||[""],()=>{ if(n.choices) renderChoices(n.choices); });
}

function renderFinal(n){
  renderText(n.text||[""],()=>{
    setTimeout(()=>{
      showModal(
        n.title||"Конец",
        `Прогресс: ${gs.прогресс} | Тревога: ${gs.тревога} | Самост.: ${gs.самостоятельность}`,
        "🔄 Начать заново","Остаться",
        ()=>resetGame(),
        ()=>hideModal()
      );
    },5500);
  });
}

// ─── SAVE / LOAD / RESET ──────────────────────────────────
function saveGame(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(gs)); }catch(e){} }
function loadGame(){
  try{
    const s=localStorage.getItem(SAVE_KEY);
    if(s){ gs=JSON.parse(s); updateStatsUI(); setBg(scenes[gs.node]?.bg||""); gotoNode(gs.node); alert("Загружено"); }
    else alert("Нет сохранений");
  }catch(e){ alert("Ошибка загрузки"); }
}
function resetGame(){
  stopTimer();
  if(bgDelayInt){ clearInterval(bgDelayInt); bgDelayInt=null; }
  gs={ node:"node1", тревога:0, самостоятельность:0, прогресс:0, стагнация:0, circleCount:0 };
  updateStatsUI(); hideModal();
  gotoNode("node1");
}

// ─── SCENES ───────────────────────────────────────────────
const scenes = {
  node1:{
    bg:"1",
    text:["Я наконец-то смог встать с кровати, всю ночь были тяжёлые мысли. Нет работы, денег совсем мало."],
    choices:[
      {text:"Вспомнить, что было на прошлом месте работы", nextNode:"node2", statChanges:{тревога:+1}},
      {text:"Начать день с хорошего, послушать музыку, выпить кофе и подкрепиться", nextNode:"node9"}
    ]
  },
  node2:{
    bg:"2",
    text:["Я вспоминаю, как начальник кричал на меня и швырял мой отчёт. Становится очень паршиво."],
    choices:[
      {text:"Подойти к ноутбуку и начать искать вакансии", nextNode:"node3", statChanges:{тревога:+1}},
      {text:"Успокоиться, выдохнуть, позавтракать и выпить кофе", nextNode:"node9"}
    ]
  },

// ─── PASSWORD ─────────────────────────────────────────────
// Чтобы сменить пароль — просто измени строку ниже
const GAME_PASSWORD = "свойпуть2025";
const PWD_KEY = "svoy_put_auth";

function checkPassword(){
  const val = document.getElementById("pwd-input").value.trim().toLowerCase();
  if(val === GAME_PASSWORD.toLowerCase()){
    try{ localStorage.setItem(PWD_KEY,"1"); }catch(e){}
    document.getElementById("pwd-screen").style.display="none";
    startAfterAuth();
  } else {
    const err = document.getElementById("pwd-error");
    err.textContent="Неверный пароль, попробуй ещё раз";
    document.getElementById("pwd-input").value="";
    document.getElementById("pwd-input").focus();
    setTimeout(()=>err.textContent="",2500);
  }
}
// Enter key support
document.getElementById("pwd-input").addEventListener("keydown", e=>{
  if(e.key==="Enter") checkPassword();
});

function startAfterAuth(){
  const saved = (()=>{ try{ const s=localStorage.getItem(SAVE_KEY); return s?JSON.parse(s):null; }catch(e){return null;} })();
  if(saved && saved.node && saved.node!=="node1"){
    showModal(
      "Свой путь",
      "Продолжить сохранённую игру или начать заново?",
      "Продолжить","Начать заново",
      ()=>{ gs=saved; updateStatsUI(); gotoNode(gs.node); },
      ()=>resetGame()
    );
  } else {
    hideModal();
    resetGame();
  }
}

// ─── BOOT ─────────────────────────────────────────────────
(function boot(){
  document.getElementById("pwd-screen").style.display="none";
  const saved = (()=>{ try{ const s=localStorage.getItem(SAVE_KEY); return s?JSON.parse(s):null; }catch(e){return null;} })();
  if(saved && saved.node && saved.node!=="node1"){
    showModal(
      "Свой путь",
      "Продолжить сохранённую игру или начать заново?",
      "Продолжить","Начать заново",
      ()=>{ gs=saved; updateStatsUI(); gotoNode(gs.node); },
      ()=>resetGame()
    );
  } else {
    hideModal();
    resetGame();
  }
})();
</script>
